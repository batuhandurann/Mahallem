name: Firebase Staging Deploy

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Firebase staging project id
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install dependencies and Firebase CLI
        run: |
          npm --prefix functions install --ignore-scripts
          npm install --global firebase-tools@15.32.1 --ignore-scripts
      - name: Re-run backend and rules tests before deploy
        run: |
          npm --prefix functions test
          npm --prefix functions run rules:test
      - name: Deploy staging rules, indexes, storage and functions
        run: |
          firebase deploy             --project "${{ inputs.project_id }}"             --only firestore:rules,firestore:indexes,storage,functions             --non-interactive
