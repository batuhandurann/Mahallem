name: Production Signed AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-production-aab:
    name: signed-production-aab
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Materialize protected production config and upload signing key
        shell: bash
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FIREBASE_CONFIG_B64:?Missing protected GOOGLE_SERVICES_JSON_BASE64}"
          : "${KEYSTORE_B64:?Missing protected ANDROID_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Missing protected ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_PASSWORD:?Missing protected ANDROID_KEY_PASSWORD}"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release-upload.jks"
          chmod 600 "$RUNNER_TEMP/release-upload.jks"
          printf '%s' "$FIREBASE_CONFIG_B64" | base64 --decode > app/google-services.json
          python3 - <<'PY'
          import json
          with open("app/google-services.json", encoding="utf-8") as f:
              cfg = json.load(f)
          pid = cfg.get("project_info", {}).get("project_id", "")
          assert pid and not pid.startswith("demo-"), "Production build requires real Firebase project"
          pkgs = {
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in cfg.get("client", [])
          }
          assert "com.batuhanduran.burada" in pkgs, "Wrong Android Firebase registration"
          PY
      - name: Clean release AAB build (real Firebase config, real signing, no CI bypass)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-upload.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean :app:bundleRelease
      - name: Verify signed AAB and record checksum
        shell: bash
        run: |
          set -euo pipefail
          artifact=app/build/outputs/bundle/release/app-release.aab
          test -s "$artifact"
          jarsigner -verify -strict "$artifact"
          sha256sum "$artifact" | tee app/build/outputs/bundle/release/app-release.aab.sha256
      - name: Upload signed AAB evidence (manual, no Play deployment)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-production-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 7
