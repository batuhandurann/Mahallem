name: Production Signed APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-production-aab:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    name: signed-production-aab
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    steps:
      - name: Require reviewed main before accessing production signing inputs
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$RELEASE_EVENT" = 'workflow_dispatch'
          test "$RELEASE_REF" = 'refs/heads/main'
      - name: Check protected signing inputs before downloading Android SDK
        shell: bash
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Only check presence. Never print protected values, even on failure.
          for name in FIREBASE_CONFIG_B64 KEYSTORE_B64 STORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing release input::Protected production input ${name} is not configured"
              exit 1
            fi
          done
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-disabled: true
      - name: Materialize protected production config and upload signing key
        shell: bash
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
        run: |
          set -euo pipefail
          : "${FIREBASE_CONFIG_B64:?Missing protected GOOGLE_SERVICES_JSON_BASE64}"
          : "${KEYSTORE_B64:?Missing protected ANDROID_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Missing protected ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_PASSWORD:?Missing protected ANDROID_KEY_PASSWORD}"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release-upload.jks"
          chmod 600 "$RUNNER_TEMP/release-upload.jks"
          printf '%s' "$FIREBASE_CONFIG_B64" | base64 --decode > app/google-services.json
          python3 scripts/verify_signed_release.py --validate-config-only
          keytool -exportcert -keystore "$RUNNER_TEMP/release-upload.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > "$RUNNER_TEMP/release-upload-cert.der"
      - name: Clean signed APK and AAB (real Firebase config, no CI bypass)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-upload.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
        run: ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean :app:assembleRelease :app:bundleRelease
      - name: Verify both artifact signatures against the protected upload key
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-upload.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
        run: python3 scripts/verify_signed_release.py
      - name: Upload signed release evidence (manual, no Play deployment)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-production-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/release-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Delete temporary signing material and Firebase config
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/release-upload.jks" "$RUNNER_TEMP/release-upload-cert.der" app/google-services.json
