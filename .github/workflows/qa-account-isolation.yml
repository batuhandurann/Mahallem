name: P0 Account Isolation Rules

on:
  push:
    branches: [main, qa/mahallem-test-suite]
  pull_request:
    branches: [main, qa/mahallem-test-suite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-isolation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  cross-account-firestore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up JDK 21 for Firebase emulator
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit
      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.32.1 --ignore-scripts
      - name: Verify cross-account read isolation and revocation in emulator
        shell: bash
        run: |
          set -euo pipefail
          firebase emulators:exec --only firestore --project mahallem-rules-test \
            'node test/account-isolation.rules.test.mjs'
