name: Production Signed AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing Play Store version code
        required: true
        type: string
      version_name:
        description: User-visible release version
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    env:
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: "9.3.1"
      - name: Materialize protected production config
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY_PRODUCTION }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$GOOGLE_SERVICES_B64"
          test -n "$MAPS_API_KEY"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          printf '%s' "$GOOGLE_SERVICES_B64" | base64 --decode > app/google-services.json
          printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > .env
      - name: Build signed production AAB
        run: gradle clean bundleRelease --no-daemon --stacktrace
      - name: Verify AAB signature and checksum
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          jarsigner -verify -strict "$AAB"
          sha256sum "$AAB" | tee app/build/outputs/bundle/release/app-release.aab.sha256
      - name: Upload signed release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-signed-aab-${{ inputs.version_name }}-${{ github.sha }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/app-release.aab.sha256
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
