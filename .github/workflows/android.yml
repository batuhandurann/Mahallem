name: Android Quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-quality-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build-test-lint:
    name: build-test-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Verify release configuration audit
        run: python3 -m unittest discover -s test/config -p 'test_*.py'
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Compile APKs, run unit tests, and enforce Android lint
        # Explicit demo configuration keeps CI independent of production credentials.
        run: ./gradlew -PfirebaseEmulators=true --continue :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-reports-and-apk
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/
            app/build/outputs/apk/androidTest/debug/
            app/build/test-results/
  release-build:
    name: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Clean unsigned release APK and AAB (CI-only; not installable production evidence)
        run: ./gradlew --no-daemon clean :app:assembleRelease :app:bundleRelease -PciUnsignedRelease=true
      - name: Verify both release artifacts have bytes
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: ci-unsigned-release-not-for-distribution
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
  # The main ruleset uses QA-style status names. These aliases remain strict:
  # they only pass when the underlying real test job succeeds, never on skip/failure.
  backend:
    name: backend
    needs: [auth-rules]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require real backend, Auth, Firestore, and media tests
        env:
          AUTH_RULES: ${{ needs.auth-rules.result }}
        run: test "$AUTH_RULES" = success
  firebase-rules:
    name: firebase-rules
    needs: [auth-rules]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require Firebase Auth and Firestore emulator tests
        env:
          AUTH_RULES: ${{ needs.auth-rules.result }}
        run: test "$AUTH_RULES" = success
  unit-and-static:
    name: unit-and-static
    needs: [build-test-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require Android debug, unit, lint, and static audit
        env:
          BUILD_UNIT_STATIC: ${{ needs.build-test-lint.result }}
        run: test "$BUILD_UNIT_STATIC" = success
  ui-tests:
    name: ui-tests
    needs: [android-emulator, build-test-lint, auth-rules, release-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce ALL P0 jobs through main-required ui-tests check
        env:
          ANDROID_EMULATOR_RESULT: ${{ needs.android-emulator.result }}
          DEBUG_UNIT_LINT_RESULT: ${{ needs.build-test-lint.result }}
          FIREBASE_AUTH_RULES_RESULT: ${{ needs.auth-rules.result }}
          RELEASE_RESULT: ${{ needs.release-build.result }}
        run: |
          test "$ANDROID_EMULATOR_RESULT" = success
          test "$DEBUG_UNIT_LINT_RESULT" = success
          test "$FIREBASE_AUTH_RULES_RESULT" = success
          test "$RELEASE_RESULT" = success
  auth-rules:
    name: auth-rules
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Backend tests and syntax validation
        run: npm run test:backend
      - name: Auth and Firestore rules
        run: npm run test:rules
      - name: Storage and trusted photo pipeline
        run: npm run test:media
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: firebase-emulator-logs
          path: '*-debug.log'
  android-emulator:
    name: android-emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - run: npm ci
      - run: npm --prefix functions ci
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: npx firebase emulators:exec --project demo-mahallem --only auth,firestore,functions './gradlew -PfirebaseEmulators=true :app:connectedDebugAndroidTest && bash scripts/adb-process-death-smoke.sh'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            *-debug.log
  required-checks:
    name: required-checks
    if: always()
    needs: [build-test-lint, auth-rules, android-emulator, release-build, ui-tests, backend, firebase-rules, unit-and-static]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to succeed
        env:
          BUILD: ${{ needs.build-test-lint.result }}
          RULES: ${{ needs.auth-rules.result }}
          EMULATOR: ${{ needs.android-emulator.result }}
          RELEASE: ${{ needs.release-build.result }}
          UI: ${{ needs.ui-tests.result }}
          BACKEND: ${{ needs.backend.result }}
          FIREBASE: ${{ needs.firebase-rules.result }}
          UNIT_STATIC: ${{ needs.unit-and-static.result }}
        run: test "$BUILD" = success && test "$RULES" = success && test "$EMULATOR" = success && test "$RELEASE" = success && test "$UI" = success && test "$BACKEND" = success && test "$FIREBASE" = success && test "$UNIT_STATIC" = success
