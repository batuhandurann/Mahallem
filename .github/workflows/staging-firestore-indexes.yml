name: Deploy Firestore Indexes (Staging Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mahallem-staging-indexes
  cancel-in-progress: false

jobs:
  deploy-staging-indexes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    env:
      STAGING_PROJECT_ID: ${{ vars.FIREBASE_STAGING_PROJECT_ID }}
      PRODUCTION_PROJECT_ID: ${{ vars.FIREBASE_PRODUCTION_PROJECT_ID }}
      STAGING_CREDENTIAL_JSON: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check explicit staging isolation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${STAGING_PROJECT_ID}" || -z "${PRODUCTION_PROJECT_ID}" || -z "${STAGING_CREDENTIAL_JSON}" ]]; then
            echo "::error::Set staging environment variables and secret before deployment."
            exit 1
          fi
          if [[ "${STAGING_PROJECT_ID}" == "${PRODUCTION_PROJECT_ID}" ]]; then
            echo "::error::Refusing to deploy indexes to the production Firebase project."
            exit 1
          fi
          node -e 'const c=require("./firebase.json"); if(c.firestore?.database !== "mahallem")process.exit(1)'
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Deploy staging Firestore indexes only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$STAGING_CREDENTIAL_JSON" > "$key_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$key_file"
          npm install --global firebase-tools@15.32.1 --ignore-scripts --no-audit
          firebase deploy --only firestore:indexes --project "$STAGING_PROJECT_ID" --non-interactive
          firebase firestore:indexes --database mahallem --project "$STAGING_PROJECT_ID"
