name: Firebase Production Deploy and Audit

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read live settings, or deploy the tested backend and verify it
        type: choice
        options: [audit, deploy]
        default: audit
        required: true
      project_id:
        description: Exact production Firebase project ID (must match environment variable)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  firebase-production:
    # Production credentials cannot be used by unmerged branches or pull requests.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      EXPECTED_PROJECT_ID: ${{ vars.FIREBASE_PRODUCTION_PROJECT_ID }}
      KEY_ID: ${{ vars.FIREBASE_ANDROID_API_KEY_ID }}
      SIGNING_SHA1: ${{ vars.FIREBASE_ANDROID_SIGNING_SHA1 }}
      SIGNING_SHA256: ${{ vars.FIREBASE_ANDROID_SIGNING_SHA256 }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      CI: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - name: Checkout protected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate explicit production target before requesting credentials
        shell: bash
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?Missing project input}"
          : "${EXPECTED_PROJECT_ID:?Missing production project variable}"
          : "${KEY_ID:?Missing Android API key resource ID}"
          : "${SIGNING_SHA1:?Missing intended distribution SHA-1 fingerprint}"
          : "${SIGNING_SHA256:?Missing intended distribution SHA-256 fingerprint}"
          : "${WIF_PROVIDER:?Missing Workload Identity provider}"
          : "${DEPLOY_SERVICE_ACCOUNT:?Missing deploy service account}"
          : "${FIREBASE_CONFIG_B64:?Missing protected Firebase Android configuration}"
          test "$PROJECT_ID" = "$EXPECTED_PROJECT_ID"
          umask 077
          printf '%s' "$FIREBASE_CONFIG_B64" | base64 --decode > app/google-services.json
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from verify_firebase_cloud import fingerprint, validate_inputs
          validate_inputs(json.load(open('app/google-services.json')), json.load(open('firebase.json')),
                          os.environ['PROJECT_ID'], os.environ['KEY_ID'])
          fingerprint(os.environ['SIGNING_SHA1'], 20)
          fingerprint(os.environ['SIGNING_SHA256'], 32)
          PY
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Set up JDK 21 for Firebase emulator verification
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Reproduce backend/security checks before Cloud authentication
        run: |
          npm ci
          npm ci --prefix functions
          python3 -m unittest discover -s test/config -p 'test_*.py'
          npm run test:backend
          npm run test:rules
          npm run test:media
      - name: Obtain short-lived authorized ADC through Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.FIREBASE_PRODUCTION_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Set up gcloud for explicit ADC evidence
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Verify live project, App Check, Play Integrity, API restrictions, Auth and private bucket
        run: >-
          python3 scripts/verify_firebase_cloud.py --project "$PROJECT_ID" --key-id "$KEY_ID"
          --signing-sha1 "$SIGNING_SHA1" --signing-sha256 "$SIGNING_SHA256"
          --report "$RUNNER_TEMP/firebase-preflight.json"
      - name: Deploy named Firestore Rules/indexes, private Storage Rules and trusted Functions
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          # Do not deploy Auth/provider configuration or silently delete functions.
          # Firebase CLI uses the explicit short-lived GOOGLE_APPLICATION_CREDENTIALS.
          ./node_modules/.bin/firebase deploy \
            --only firestore:rules,firestore:indexes,storage,functions:trusted-backend \
            --project "$PROJECT_ID" --non-interactive
          gcloud firestore fields ttls update expiresAt --collection-group=_abuseBudgets \
            --database=mahallem --enable-ttl --project="$PROJECT_ID" --quiet
          gcloud firestore fields ttls update expiresAt --collection-group=_pushDeliveries \
            --database=mahallem --enable-ttl --project="$PROJECT_ID" --quiet
      - name: Verify actual deployed Rules content, ready index, active TTL and bounded functions
        # Audit is also useful after an earlier deploy. Initial unready indexes fail
        # explicitly; rerun audit when Cloud has finished building the index.
        run: >-
          python3 scripts/verify_firebase_cloud.py --project "$PROJECT_ID" --key-id "$KEY_ID"
          --signing-sha1 "$SIGNING_SHA1" --signing-sha256 "$SIGNING_SHA256"
          --deployed --report "$RUNNER_TEMP/firebase-postflight.json"
      - name: Upload only redacted live evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firebase-production-redacted-evidence
          path: |
            ${{ runner.temp }}/firebase-preflight.json
            ${{ runner.temp }}/firebase-postflight.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove materialized Android config and any local CLI debug log
        if: always()
        shell: bash
        run: rm -f app/google-services.json firebase-debug.log firestore-debug.log
